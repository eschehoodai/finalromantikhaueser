<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9EBBD" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A2741E" />
    </linearGradient>
    <clipPath id="flowerClip">
      <circle cx="50" cy="50" r="42" />
    </clipPath>
  </defs>
  
  <!-- Hintergrund-Siegel fuer harmonischen Kontrast in hellen und dunklen Browser-Tabs -->
  <circle cx="50" cy="50" r="48" fill="#1C1813" stroke="url(#goldGrad)" stroke-width="0.8" />
  
  <!-- Blume des Lebens (19 Kreise im heiligen Schnitt) -->
  <g clip-path="url(#flowerClip)" fill="none" stroke="url(#goldGrad)" stroke-width="1.7" stroke-linecap="round">
    <circle cx="50" cy="50" r="14" />
    <circle cx="64" cy="50" r="14" />
    <circle cx="57" cy="62.12" r="14" />
    <circle cx="43" cy="62.12" r="14" />
    <circle cx="36" cy="50" r="14" />
    <circle cx="43" cy="37.88" r="14" />
    <circle cx="57" cy="37.88" r="14" />
    <circle cx="78" cy="50" r="14" />
    <circle cx="64" cy="74.25" r="14" />
    <circle cx="36" cy="74.25" r="14" />
    <circle cx="22" cy="50" r="14" />
    <circle cx="36" cy="25.75" r="14" />
    <circle cx="64" cy="25.75" r="14" />
    <circle cx="71" cy="62.12" r="14" />
    <circle cx="50" cy="74.25" r="14" />
    <circle cx="29" cy="62.12" r="14" />
    <circle cx="29" cy="37.88" r="14" />
    <circle cx="50" cy="25.75" r="14" />
    <circle cx="71" cy="37.88" r="14" />
  </g>
  
  <!-- Aeussere Schutz- und Fassungsringe -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />
</svg>