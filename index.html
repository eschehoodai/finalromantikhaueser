    <!-- DIRS21 Widgets Theme Stylesheet -->
    <link rel="stylesheet" href="https://v5.widgets.dirs21.de/style.css?v=1.0.27" />

    <!-- DIRS21 SPA Navigation Shield (verhindert unhandled TypeError in unmountWidget bei React Router Seitenwechsel) -->
    <script>
      (function() {
        var origQuerySelector = Document.prototype.querySelector;
        Document.prototype.querySelector = function(selector) {
          var el = origQuerySelector.apply(this, arguments);
          if (!el && typeof selector === 'string' && selector.indexOf('.d21-') !== -1) {
            var dummy = document.createElement('div');
            var match = selector.match(/d21-([0-9a-fA-F-]{36})/);
            if (match) {
              dummy.setAttribute('d21-widget-uuid', match[1]);
            }
            return dummy;
          }
          return el;
        };
      })();
    </script>

    <!-- DIRS21 Sub-Widget Modules vorab laden/registrieren -->
    <script type="module" src="https://v5.widgets.dirs21.de/availabilityCalendar.js?v=1.0.27"></script>
